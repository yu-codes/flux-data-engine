[project]
name = "flux-data-engine"
version = "1.0.0"
description = "A general-purpose Data, Model and Execution platform"
requires-python = ">=3.11"
license = { file = "../LICENSE" }
dependencies = [
    # api
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "requests>=2.32",
    # persistence
    "SQLAlchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    # data processing and analytical storage
    "pyarrow>=17.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "openpyxl>=3.1",
    # queue and object storage backends, behind their ports
    "redis>=5.2",
    "boto3>=1.35",
    # ml provider only - never imported by the core domain
    "scikit-learn>=1.5",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 92
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",   # FastAPI depends on callables in argument defaults
    "UP042",  # (str, Enum) is deliberate: identical JSON behaviour, wider reach
]

[tool.ruff.lint.per-file-ignores]
# Preserved research code, kept byte-for-byte as written so its numerical
# behaviour stays verifiable against the original pipeline. The only edits are
# the import statements that rehome it onto this package, so every stylistic
# rule - including import sorting and syntax modernisation - is off here.
"app/plugins/typhoon_analog/algorithms/*" = [
    "E", "F401", "F841", "I", "UP", "B905", "W",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
