# Combined RRF 模型配置
name: combined_rrf
description: "Combined RRF: KNN + DTW + Rule-Based with Reciprocal Rank Fusion"
method: combined
parameters:
  alpha: 0.13
  rule_weight: 0.25
  k: 5
  impact_radius_km: 500.0
  pool_size_factor: 10
  rrf_k: 60
  dtw_weights: [1.0, 1.0, 1.0, 0.5]
  sakoe_chiba_ratio: 0.3
evaluation:
  metrics:
    - category_accuracy
    - rainfall_analysis
  leave_one_out: true
  categories: ["1", "2", "3", "4", "5", "6", "7", "8", "9"]
