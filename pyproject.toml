[project]
name = "flux-data-engine"
version = "3.0.0"
description = "Flux Data Engine — 多災害類比預測引擎，基於歷史相似度的影響導向預測系統"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "dtaidistance>=2.3",
    "openpyxl>=3.1",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
]
