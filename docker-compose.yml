services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    ports:
      - "38000:38000"
    environment:
      - PYTHONIOENCODING=utf-8
    volumes:
      - ./data:/app/data
      - ./experiments:/app/experiments
      - ./models:/app/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:38000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    ports:
      - "3001:3001"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
